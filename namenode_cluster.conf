# NameNode Cluster Configuration
# This file is used by DataNodes and Clients to discover active NameNode

# NameNode addresses (format: host:port)
namenodes=localhost:8080,localhost:8081

# Primary NameNode (default connection)
primary=localhost:8080

# Failover timeout (seconds)
failover_timeout=5

# Retry interval (seconds)
retry_interval=2
